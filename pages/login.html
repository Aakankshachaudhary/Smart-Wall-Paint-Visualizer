<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in | Smart Paint</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body data-page="auth">
    <header class="site-header">
      <div class="container header-container">
        <a class="logo" href="../index.html">
          <span class="logo-mark"> SP </span>
          <span class="logo-text"> Smart Paint </span>
        </a>
        <a class="button-link" href="../index.html"> Back to home </a>
      </div>
    </header>
    <main class="page-shell">
      <div class="form-shell">
        <section class="card auth-card">
          <div class="auth-brand">
            <div class="logo-mark">SP</div>
            <h1>Welcome back</h1>
            <p class="auth-subtitle">
              Sign in to continue designing your room.
            </p>
          </div>
          <form id="auth-form" data-mode="login">
            <div class="form-group">
              <label for="email"> Email address </label>
              <input
                id="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="form-group">
              <label for="password"> Password </label>
              <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
                required
                minlength="6"
              />
            </div>
            <p id="auth-message" aria-live="polite"></p>
            <button class="button primary" type="submit">Sign in</button>
          </form>
          <p class="auth-footer">
            New to Smart Paint?
            <a href="register.html"> Create an account </a>
          </p>
          <p class="form-note">
            Demo note: this frontend uses browser storage; no password is sent
            to a server.
          </p>
        </section>
      </div>
    </main>
    <script src="../js/storage.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
