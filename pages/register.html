<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create account | Smart Paint</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body data-page="auth">
    <header class="site-header">
      <div class="container header-container">
        <a class="logo" href="../index.html">
          <span class="logo-mark"> SP </span>
          <span class="logo-text"> Smart Paint </span>
        </a>
        <a class="button-link" href="../index.html"> Back to home </a>
      </div>
    </header>
    <main class="page-shell">
      <div class="form-shell">
        <section class="card auth-card">
          <div class="auth-brand">
            <div class="logo-mark">SP</div>
            <h1>Create your workspace</h1>
            <p class="auth-subtitle">
              Save room concepts and return to them anytime.
            </p>
          </div>
          <form id="auth-form" data-mode="register">
            <div class="form-group">
              <label for="name"> Full name </label>
              <input
                id="name"
                type="text"
                autocomplete="name"
                placeholder="Your name"
                required
              />
            </div>
            <div class="form-group">
              <label for="email"> Email address </label>
              <input
                id="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="form-group">
              <label for="password"> Password </label>
              <input
                id="password"
                type="password"
                autocomplete="new-password"
                placeholder="At least 6 characters"
                required
                minlength="6"
              />
            </div>
            <label class="checkbox-row">
              <input type="checkbox" required />
              <span>
                I agree to use this demo application for design visualization.
              </span>
            </label>
            <p id="auth-message" aria-live="polite"></p>
            <button class="button primary" type="submit">Create account</button>
          </form>
          <p class="auth-footer">
            Already have an account?
            <a href="login.html"> Sign in </a>
          </p>
        </section>
      </div>
    </main>
    <script src="../js/storage.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
