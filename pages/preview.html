<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Preview Design</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

</head>

<body>

    <header class="site-header">

        <h1>Smart Wall Paint Visualizer</h1>

    </header>

    <main>

        <section class="preview-section">

            <h2>Before & After Preview</h2>

            <div class="preview-container">

                <div class="preview-card">

                    <h3>Before</h3>

                    <img
                        id="before-image"
                        alt="Original room"
                    >

                </div>

                <div class="preview-card">

                    <h3>After</h3>

                    <img
                        id="after-image"
                        alt="Painted room"
                    >

                </div>
                
                <div class="preview-actions">

                   <button
                      type="button"
                      id="save-design"
                    >
                        Save Design
                    </button>

                </div> 

            </div>

        </section>

    </main>

    <script src="../js/storage.js"></script>
   <script src="../js/app.js"></script>


</body>

</html>
