<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Design | Smart Wall Paint Visualizer</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-container">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🎨</span>
                <span class="logo-text">Smart Paint</span>
            </a>
            <nav class="main-navigation" aria-label="Main navigation">
                <a href="../index.html">Home</a>
                <a href="upload.html">Visualizer</a>
                <a href="saved-designs.html">My Designs</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="preview-section">
            <div class="container">
                <h1>Before &amp; After Preview</h1>
                <p class="page-description">
                    Compare your original room with the painted design before saving it.
                </p>

                <div id="preview-status" class="preview-status" role="status" aria-live="polite"></div>

                <div class="preview-controls" aria-label="Preview display options">
                    <button type="button" class="preview-mode active" data-mode="side-by-side">
                        Side by Side
                    </button>
                    <button type="button" class="preview-mode" data-mode="before">
                        Show Before
                    </button>
                    <button type="button" class="preview-mode" data-mode="after">
                        Show After
                    </button>
                </div>

                <div id="preview-container" class="preview-container">
                    <div class="preview-card" id="before-card">
                        <h2>Before</h2>
                        <img id="before-image" alt="Original room">
                    </div>

                    <div class="preview-card" id="after-card">
                        <h2>After</h2>
                        <img id="after-image" alt="Room with selected wall paint">
                    </div>
                </div>

                <section class="comparison-tool" aria-label="Interactive before and after comparison">
                    <div class="comparison-header">
                        <div>
                            <span class="eyebrow">COMPARE</span>
                            <h2>Slide to compare</h2>
                        </div>
                        <span id="comparison-value">50% After</span>
                    </div>
                    <div class="comparison-frame" id="comparison-frame">
                        <img id="comparison-before-image" alt="Original room comparison">
                        <div class="comparison-after-layer" id="comparison-after-layer">
                            <img id="comparison-after-image" alt="Painted room comparison">
                        </div>
                        <span class="comparison-divider" id="comparison-divider" aria-hidden="true"></span>
                    </div>
                    <label class="comparison-slider-label" for="comparison-slider">After image amount</label>
                    <input type="range" id="comparison-slider" min="0" max="100" value="50">
                </section>

                <div id="design-summary" class="design-summary"></div>

                <div class="preview-actions" aria-label="Design actions">
                    <div class="primary-actions">
                        <button type="button" id="save-design" class="action-button primary-action">
                            <span class="action-icon" aria-hidden="true">💾</span>
                            <span class="action-text">Save Design</span>
                        </button>
                        <button type="button" id="download-design" class="action-button secondary-action">
                            <span class="action-icon" aria-hidden="true">↓</span>
                            <span class="action-text">Download Design</span>
                        </button>
                    </div>
                    <div class="secondary-actions">
                        <a href="wall-selection.html" class="button-link">Edit Design</a>
                        <a href="saved-designs.html" class="button-link secondary-button-link">My Designs</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
