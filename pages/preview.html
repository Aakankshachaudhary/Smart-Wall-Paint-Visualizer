<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Design preview | Smart Paint</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body data-page="preview">
    <header class="site-header">
      <div class="container header-container">
        <a class="logo" href="../index.html">
          <span class="logo-mark"> SP </span>
          <span class="logo-text"> Smart Paint </span>
        </a>
        <nav class="main-navigation">
          <a href="../index.html"> Home </a>
          <a href="saved-designs.html"> My Designs </a>
        </nav>
        <div class="header-actions">
          <a class="button-link" href="wall-selection.html"> Edit </a>
        </div>
      </div>
    </header>
    <main class="page-shell preview-page">
      <div class="container">
        <div class="preview-header">
          <header class="page-header">
            <p class="eyebrow">03 · REVIEW</p>
            <h1 class="page-title">See your room before you paint</h1>
            <p class="page-description">
              Compare the original room with your selected finish, then save or
              download the result.
            </p>
          </header>
        </div>
        <div class="preview-toolbar">
          <button class="preview-mode active" data-mode="side">
            Side by side
          </button>
          <button class="preview-mode" data-mode="comparison">
            Interactive comparison
          </button>
          <button class="preview-mode" data-mode="before">Before only</button>
          <button class="preview-mode" data-mode="after">After only</button>
        </div>
        <p id="preview-status" class="preview-status" aria-live="polite"></p>
        <section id="preview-container" class="preview-container">
          <article class="card preview-card">
            <img id="before-image" alt="Original room" />
            <h2>Before</h2>
          </article>
          <article class="card preview-card">
            <img id="after-image" alt="Room with selected paint design" />
            <h2>After</h2>
          </article>
        </section>
        <section id="comparison-tool" class="card comparison-tool mode-hidden">
          <div class="comparison-frame">
            <img id="comparison-before-image" alt="" />
            <div id="comparison-after-layer" class="comparison-after-layer">
              <img id="comparison-after-image" alt="" />
            </div>
            <span class="comparison-label before"> Before </span>
            <span class="comparison-label after"> After </span>
            <div id="comparison-divider" class="comparison-divider"></div>
            <input
              id="comparison-slider"
              class="comparison-slider"
              type="range"
              min="0"
              max="100"
              value="50"
              aria-label="Before and after comparison"
            />
          </div>
          <p class="comparison-help">
            Drag the slider to compare the original and painted room.
          </p>
        </section>
        <section id="design-summary" class="design-summary-grid"></section>
        <div class="preview-actions">
          <div class="primary-actions">
            <button id="save-design" class="button primary">Save Design</button>
            <button id="download-design" class="button secondary">
              Download Design
            </button>
          </div>
          <div class="secondary-actions">
            <a class="button-link" href="wall-selection.html"> Edit design </a>
            <a class="button-link" href="saved-designs.html"> My Designs </a>
          </div>
        </div>
      </div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
