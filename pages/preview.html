<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
      <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <title>Colour Preview | Smart Paint</title>
</head>

<body>

    <main>

        <section class="preview-section">

            <h1>
                Colour Preview
            </h1>

            <div class="preview-container">

                <div class="before-preview">

                    <h2>
                        Before
                    </h2>

                    <div id="beforeImage">
                    </div>

                </div>


                <div class="after-preview">

                    <h2>
                        After
                    </h2>

                    <div id="afterImage">
                    </div>

                </div>

            </div>


            <section class="color-controls">

                <h2>
                    Choose Colour
                </h2>

                <div id="colorPalette">
                </div>


                <label for="customColor">
                    Custom Colour
                </label>

                <input
                    type="color"
                    id="customColor"
                    value="#4A90E2"
                >


                <label for="opacity">
                    Opacity
                </label>

                <input
                    type="range"
                    id="opacity"
                    min="0"
                    max="100"
                    value="80"
                >

            </section>

        </section>

    </main>

</body>

</html>
