<!DOCTYPE html>
<html lang="en">

<head>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard | Smart Paint</title>
</head>

<body>

    <main>

        <section class="admin-dashboard">

            <h1>
                Admin Dashboard
            </h1>

            <div class="kpi-container">

                <article class="kpi-card">
                    <h2>0</h2>
                    <p>Users</p>
                </article>

                <article class="kpi-card">
                    <h2>0</h2>
                    <p>Images Uploaded</p>
                </article>

                <article class="kpi-card">
                    <h2>0</h2>
                    <p>Saved Designs</p>
                </article>

                <article class="kpi-card">
                    <h2>0</h2>
                    <p>Available Colours</p>
                </article>

            </div>


            <section>

                <h2>
                    Colour Management
                </h2>

                <button type="button">
                    Add Colour
                </button>

            </section>


            <section>

                <h2>
                    Pattern Management
                </h2>

                <button type="button">
                    Add Pattern
                </button>

            </section>

        </section>

    </main>

</html>
