<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My designs | Smart Paint</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body data-page="saved">
    <header class="site-header">
      <div class="container header-container">
        <a class="logo" href="../index.html">
          <span class="logo-mark"> SP </span>
          <span class="logo-text"> Smart Paint </span>
        </a>
        <nav class="main-navigation">
          <a href="../index.html"> Home </a>
          <a href="upload.html"> Visualizer </a>
        </nav>
        <div class="header-actions">
          <a class="button primary" href="upload.html"> New design </a>
        </div>
      </div>
    </header>
    <main class="page-shell">
      <div class="container">
        <header class="page-header">
          <p class="eyebrow">YOUR WORKSPACE</p>
          <h1 class="page-title">My designs</h1>
          <p class="page-description">
            Keep room concepts together so you can reopen, compare, download or
            remove them later.
          </p>
        </header>
        <div class="saved-toolbar">
          <input
            id="saved-design-search"
            type="search"
            placeholder="Search by name, colour or pattern"
            aria-label="Search saved designs"
          />
          <select id="saved-design-sort" aria-label="Sort saved designs">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="pattern">Pattern A–Z</option>
          </select>
        </div>
        <p id="saved-design-count" class="saved-count"></p>
        <div id="saved-designs-container" class="saved-designs-container"></div>
      </div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
