<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Saved Designs</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

</head>

<body>

    <header class="site-header">

        <h1>Smart Wall Paint Visualizer</h1>
<p class="page-description">View, download, or delete your saved wall designs.</p>

    </header>

    <main>

        <section class="saved-designs-section">

            <h2>Saved Designs</h2>

            <div class="saved-design-toolbar" aria-label="Saved design filters">
                <label for="saved-design-search">Search designs</label>
                <input type="search" id="saved-design-search" placeholder="Search by pattern or colour...">
                <label for="saved-design-sort">Sort</label>
                <select id="saved-design-sort">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="pattern">Pattern A-Z</option>
                </select>
            </div>

            <p id="saved-design-count" class="saved-design-count" aria-live="polite"></p>

            <div
                id="saved-designs-container"
                class="saved-designs-container"
            >
            </div>

        </section>

    </main>

    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>

</body>

</html>
