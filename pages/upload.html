<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Room | Smart Paint</title>
</head>i
<body>
    <main>
        <section class="upload-section">
            <h1>
                Upload Your Room
            </h1>
            <p>
                Upload a clear JPG or PNG image of your room.
            </p>
            <form >
                <label for="room-image">Choose Room Image</label>
                <input type="file" id="room-image" name="roomImage" accept="image/jpeg,image/png">
                <p>Upload only images that your own or have permission to use.</p>
                <button type="submit">Continue</button>
            </form>
        </section>
    </main>
</body>
</html>
