<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <title>Select Wall | Smart Paint</title>
</head>

<body>

    <main>

        <section class="wall-selection-section">

            <h1>
                Select Your Wall
            </h1>

            <p>
                Select the wall area you want to paint.
            </p>

            <div class="canvas-container">

                <div class="canvas-tools">

                    <button type="button" id="start-selection">
                        Start Selection
                    </button>

                </div>
                <div class="selection-controls">

                <button type="button" id="undo-selection">
                    Undo
                </button>

                <button type="button" id="clear-selection">
                    Clear Selection
                </button>

                <button type="button" id="finish-selection">
                    Finish Selection
                </button>

            </div>

        <div class="paint-controls">
            <label for="paint-color">Paint Colour:</label>
        <div class="color-palette">
             <span class="palette-label">Choose a colour:</span>

            <button
             type="button"
             class="color-option"
             data-color="#ffffff"
             aria-label="White"
             style="background-color: #ffffff;"
           ></button>

            <button
             type="button"
             class="color-option"
             data-color="#f5e6c8"
             aria-label="Cream"
             style="background-color: #f5e6c8;"
           ></button>

            <button
             type="button"
             class="color-option"
             data-color="#9ca3af"
             aria-label="Grey"
             style="background-color: #9ca3af;"
           ></button>

            <button
             type="button"
             class="color-option"
             data-color="#60a5fa"
             aria-label="Light Blue"
             style="background-color: #60a5fa;"
           ></button>

            <button
             type="button"
             class="color-option"
              data-color="#86efac"
              aria-label="Light Green"
              style="background-color: #86efac;"
           ></button>

            <button
             type="button"
             class="color-option"
             data-color="#f9a8d4"
             aria-label="Pink"
             style="background-color: #f9a8d4;"
           ></button>
        </div>

           <input
           type="color"
           id="paint-color"
           value="#4f46e5"
           >

          <label for="paint-opacity">Opacity:</label>

          <input
          type="range"
          id="paint-opacity"
          min="10"
          max="100"
          value="70"
          >

          <span id="opacity-value">70%</span>

          <button type="button" id="apply-paint">
           Apply Paint
          </button>

          <button type="button" id="reset-paint">
           Reset Paint
          </button>
        </div>

                <p id="selection-status">
                    Click "Start Selection" to select a wall area.
                </p>

                <canvas
                    id="wallCanvas"
                    aria-label="Room wall selection area"
                >
                </canvas>

            </div>

            

        </section>

    </main>

    <script src="../js/canvas.js"></script>

</body>

</html>
