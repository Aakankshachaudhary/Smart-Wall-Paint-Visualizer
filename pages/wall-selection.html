<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Select Wall | Smart Paint</title>
</head>

<body>

    <main>

        <section class="wall-selection-section">

            <h1>
                Select Your Wall
            </h1>

            <p>
                Select the wall area you want to paint.
            </p>

            <div class="canvas-container">

                <canvas
                    id="wallCanvas"
                    aria-label="Room wall selection area"
                >
                </canvas>

            </div>

            <div class="selection-controls">

                <button type="button">
                    Undo
                </button>

                <button type="button">
                    Clear
                </button>

                <button type="button">
                    Finish Selection
                </button>

            </div>

        </section>

    </main>

</body>

</html>
