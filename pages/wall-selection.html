<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Room editor | Smart Paint</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-container">
        <a class="logo" href="../index.html">
          <span class="logo-mark"> SP </span>
          <span class="logo-text"> Smart Paint </span>
        </a>
        <nav class="main-navigation">
          <a href="../index.html"> Home </a>
          <a href="saved-designs.html"> My Designs </a>
        </nav>
        <div class="header-actions">
          <a class="button-link" href="upload.html"> New room </a>
        </div>
      </div>
    </header>
    <main class="page-shell">
      <div class="container">
        <div class="editor-topbar">
          <div class="editor-breadcrumb">Visualizer / Room editor</div>
          <div class="editor-navigation">
            <a class="button-link" href="upload.html"> Change photo </a>
            <a class="button-link" href="saved-designs.html"> My Designs </a>
          </div>
        </div>
        <div class="editor-layout">
          <section class="card editor-stage">
            <div class="selection-guide">
              <div>
                <strong id="active-wall-label"> Wall 1 </strong>
                <div id="selection-hint">
                  Select a wall or start a new selection.
                </div>
              </div>
              <span id="selection-point-count" class="selection-point-count">
                0 points
              </span>
            </div>
            <div class="canvas-stage">
              <canvas id="wallCanvas"> </canvas>
            </div>
            <p
              id="selection-status"
              class="selection-status"
              aria-live="polite"
            ></p>
            <div class="selection-controls">
              <button id="start-selection" class="button primary">
                New wall
              </button>
              <button id="undo-selection" class="button secondary">
                Undo point
              </button>
              <button id="clear-selection" class="button secondary">
                Clear wall
              </button>
              <button id="finish-selection" class="button secondary">
                Finish wall
              </button>
            </div>
          </section>
          <aside class="card editor-sidebar">
            <div class="editor-section">
              <div class="sidebar-label">Your walls</div>
              <div id="wall-list" class="wall-list"></div>
            </div>
            <div class="editor-section">
              <div class="sidebar-label">Paint colour</div>
              <div class="color-palette">
                <button
                  class="color-option"
                  data-color="#F3F1EA"
                  style="background: #f3f1ea"
                  aria-label="Cloud White"
                ></button>
                <button
                  class="color-option"
                  data-color="#D9C7AA"
                  style="background: #d9c7aa"
                  aria-label="Warm Linen"
                ></button>
                <button
                  class="color-option"
                  data-color="#C6A985"
                  style="background: #c6a985"
                  aria-label="Sandstone"
                ></button>
                <button
                  class="color-option"
                  data-color="#8FA88B"
                  style="background: #8fa88b"
                  aria-label="Sage Leaf"
                ></button>
                <button
                  class="color-option"
                  data-color="#91AFC4"
                  style="background: #91afc4"
                  aria-label="Misty Blue"
                ></button>
                <button
                  class="color-option"
                  data-color="#B86F55"
                  style="background: #b86f55"
                  aria-label="Terracotta"
                ></button>
                <button
                  class="color-option"
                  data-color="#42604B"
                  style="background: #42604b"
                  aria-label="Deep Forest"
                ></button>
                <button
                  class="color-option"
                  data-color="#41454A"
                  style="background: #41454a"
                  aria-label="Charcoal"
                ></button>
              </div>
              <div class="custom-color">
                <input id="paint-color" type="color" value="#8FA88B" />
                <span> Custom colour </span>
              </div>
            </div>
            <div class="editor-section">
              <div class="sidebar-label">Finish & pattern</div>
              <div class="design-palette">
                <button class="design-option active" data-design="solid">
                  Solid
                </button>
                <button class="design-option" data-design="vertical-stripes">
                  Vertical stripes
                </button>
                <button class="design-option" data-design="horizontal-stripes">
                  Horizontal stripes
                </button>
                <button class="design-option" data-design="grid">Grid</button>
              </div>
            </div>
            <div class="editor-section">
              <div class="sidebar-label">Paint strength</div>
              <div class="range-row">
                <input
                  id="paint-opacity"
                  type="range"
                  min="10"
                  max="100"
                  value="70"
                />
                <span id="opacity-value" class="range-value"> 70% </span>
              </div>
            </div>
            <div class="editor-actions">
              <button id="apply-paint" class="button primary">
                Apply to wall
              </button>
              <button id="reset-paint" class="button secondary">
                Reset wall
              </button>
              <button id="preview-design" class="button primary">
                Preview design →
              </button>
            </div>
          </aside>
        </div>
      </div>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script src="../js/storage.js"></script>
    <script src="../js/colors.js"></script>
    <script src="../js/designs.js"></script>
    <script src="../js/canvas.js?v=room-fix-3"></script>
  </body>
</html>
