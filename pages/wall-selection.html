<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <title>Select Wall | Smart Paint</title>
</head>

<body>

    <main>

        <section class="wall-selection-section">

            <h1>
                Select Your Wall
            </h1>

            <p>
                Select the wall area you want to paint.
            </p>

            <div class="canvas-container">

                <div class="canvas-tools">

                    <button type="button" id="start-selection">
                        Start Selection
                    </button>

                </div>
                <div class="selection-controls">

                <button type="button" id="undo-selection">
                    Undo
                </button>

                <button type="button" id="clear-selection">
                    Clear Selection
                </button>

                <button type="button" id="finish-selection">
                    Finish Selection
                </button>

            </div>

                <p id="selection-status">
                    Click "Start Selection" to select a wall area.
                </p>

                <canvas
                    id="wallCanvas"
                    aria-label="Room wall selection area"
                >
                </canvas>

            </div>

            

        </section>

    </main>

    <script src="../js/canvas.js"></script>

</body>

</html>
